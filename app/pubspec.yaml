name: lograt
description: "Keep track of all your strength training numbers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  path: ^1.9.1
  flutter_svg: ^2.2.3
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  path_provider: ^2.1.6
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  logging: ^1.3.0
  uuid: ^4.6.0
  bloc: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  mockito: ^5.4.6
  flutter_native_splash: ^2.4.7
  drift_dev: ^2.28.0

flutter_native_splash:
  color: "#FDD835"
  image: assets/images/lograt_splash.png
  fullscreen: true
  android_12:
    color: "#FDD835"
    image: assets/images/lograt_splash_android12.png
    icon_background_color: "#FDD835"

flutter:
  uses-material-design: true
  assets:
    - assets/svgs/lograt_icon.svg
    - assets/images/lograt_splash.png
    - assets/images/lograt_splash_android12.png